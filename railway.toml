[build]
builder = "nixpacks"
buildCommand = "NODE_ENV=development pnpm install --no-frozen-lockfile && pnpm --filter @workspace/db run push-force && pnpm --filter @workspace/api-server run build"

[build.nixpacks]
packages = ["ffmpeg"]

[deploy]
startCommand = "npx pnpm --filter @workspace/api-server run start"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
